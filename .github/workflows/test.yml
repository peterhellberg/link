on:
  push:
    branches: [master]
  pull_request:
name: Tests
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.18.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Run tests
      run: go test -v ./...
